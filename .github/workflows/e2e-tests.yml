name: E2E Tests (Playwright)

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e-tests.yml"

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: knowledgeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (Backend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/knowledgeforge_test

      - name: Seed test database
        working-directory: backend
        run: python scripts/seed_db.py
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/knowledgeforge_test
          APP_ENV: test

      - name: Start backend API server
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/backend.pid
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            echo "Waiting for backend... attempt $i"
            sleep 2
          done
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/knowledgeforge_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-placeholder
          JWT_SECRET_KEY: ci-test-jwt-secret-placeholder
          APP_ENV: test
          CORS_ORIGINS: '["http://localhost:3000"]'

      - name: Set up Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
          NEXT_PUBLIC_APP_NAME: KnowledgeForge
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-e2e-secret-placeholder

      - name: Start frontend server
        working-directory: frontend
        run: |
          npx next start &
          echo $! > /tmp/frontend.pid
          # Wait for frontend to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && break
            echo "Waiting for frontend... attempt $i"
            sleep 2
          done
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-e2e-secret-placeholder

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          [ -f /tmp/frontend.pid ] && kill $(cat /tmp/frontend.pid) || true
          [ -f /tmp/backend.pid ] && kill $(cat /tmp/backend.pid) || true
