name: Deploy to AWS ECS

on:
  push:
    branches:
      - main
      - feature/development
  workflow_dispatch:   # Allow manual trigger from GitHub UI

env:
  AWS_REGION:  us-east-1
  ACCOUNT_ID:  "993750298110"
  PROJECT:     knowledgeforge

# ─────────────────────────────────────────────────────────────
# Job 1 — Get shared values (image tag + ALB DNS)
# ─────────────────────────────────────────────────────────────
jobs:
  setup:
    name: Setup (tag + ALB DNS)
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.vars.outputs.tag }}
      alb_dns: ${{ steps.vars.outputs.alb_dns }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Get image tag and ALB DNS
        id: vars
        run: |
          TAG="${GITHUB_SHA::8}"
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.PROJECT }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text --region "${{ env.AWS_REGION }}")
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "Image tag  : $TAG"
          echo "ALB DNS    : $ALB_DNS"

# ─────────────────────────────────────────────────────────────
# Job 2a — Build & push backend (parallel with 2b)
# ─────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        run: |
          ECR="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT }}-backend"
          TAG="${{ needs.setup.outputs.tag }}"

          docker build \
            --platform linux/amd64 \
            --cache-from "${ECR}:latest" \
            -t "${ECR}:${TAG}" \
            -t "${ECR}:latest" \
            ./backend

          docker push "${ECR}:${TAG}"
          docker push "${ECR}:latest"
          echo "✓ Backend pushed → ${ECR}:${TAG}"

# ─────────────────────────────────────────────────────────────
# Job 2b — Build & push frontend (parallel with 2a)
#   NEXT_PUBLIC_* vars are baked in at build time
# ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push frontend
        run: |
          ECR="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT }}-frontend"
          TAG="${{ needs.setup.outputs.tag }}"
          ALB="${{ needs.setup.outputs.alb_dns }}"

          docker build \
            --platform linux/amd64 \
            --cache-from "${ECR}:latest" \
            --build-arg NEXT_PUBLIC_API_URL="http://${ALB}:8000" \
            --build-arg NEXT_PUBLIC_WS_URL="ws://${ALB}:8000" \
            --build-arg NEXT_PUBLIC_APP_URL="http://${ALB}" \
            -t "${ECR}:${TAG}" \
            -t "${ECR}:latest" \
            ./frontend

          docker push "${ECR}:${TAG}"
          docker push "${ECR}:latest"
          echo "✓ Frontend pushed → ${ECR}:${TAG}"

# ─────────────────────────────────────────────────────────────
# Job 3 — Register new task defs and deploy to ECS
# ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [setup, build-backend, build-frontend]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Register backend task definition ──────────────────
      - name: Register backend task definition
        id: backend_task
        env:
          TAG:             ${{ needs.setup.outputs.tag }}
          ALB_DNS:         ${{ needs.setup.outputs.alb_dns }}
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          SECRET_KEY:      ${{ secrets.SECRET_KEY }}
          ANTHROPIC_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_KEY:      ${{ secrets.OPENAI_API_KEY }}
          TAVILY_KEY:      ${{ secrets.TAVILY_API_KEY }}
        run: |
          ECR_BASE="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          EXEC_ROLE="arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ env.PROJECT }}-ecs-execution-role"

          # Use Python to build JSON safely (handles special chars in secrets)
          python3 - <<'PYEOF' > /tmp/backend-task.json
          import json, os

          ACCOUNT  = "${{ env.ACCOUNT_ID }}"
          REGION   = "${{ env.AWS_REGION }}"
          PROJECT  = "${{ env.PROJECT }}"
          ECR_BASE = f"{ACCOUNT}.dkr.ecr.{REGION}.amazonaws.com"
          ALB      = os.environ["ALB_DNS"]
          TAG      = os.environ["TAG"]

          task = {
            "family": f"{PROJECT}-backend",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": f"arn:aws:iam::{ACCOUNT}:role/{PROJECT}-ecs-execution-role",
            "containerDefinitions": [
              {
                "name": "backend",
                "image": f"{ECR_BASE}/{PROJECT}-backend:{TAG}",
                "portMappings": [{"containerPort": 8000, "protocol": "tcp"}],
                "essential": True,
                "environment": [
                  {"name": "DATABASE_URL",      "value": os.environ.get("DATABASE_URL", "")},
                  {"name": "DATABASE_SSL",       "value": "true"},
                  {"name": "REDIS_URL",          "value": "redis://localhost:6379"},
                  {"name": "SECRET_KEY",         "value": os.environ.get("SECRET_KEY", "")},
                  {"name": "ANTHROPIC_API_KEY",  "value": os.environ.get("ANTHROPIC_KEY", "")},
                  {"name": "OPENAI_API_KEY",     "value": os.environ.get("OPENAI_KEY", "")},
                  {"name": "TAVILY_API_KEY",     "value": os.environ.get("TAVILY_KEY", "")},
                  {"name": "CORS_ORIGINS",       "value": f'["http://{ALB}","http://{ALB}:8000","http://localhost:3001"]'},
                  {"name": "DEBUG",              "value": "false"},
                  {"name": "UPLOAD_DIR",         "value": "uploads"},
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group":         f"/ecs/{PROJECT}-backend",
                    "awslogs-region":        REGION,
                    "awslogs-stream-prefix": "ecs",
                  }
                },
                "healthCheck": {
                  "command":     ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"],
                  "interval":    30,
                  "timeout":     10,
                  "retries":     3,
                  "startPeriod": 40,
                },
              },
              {
                "name": "redis",
                "image": "redis:7-alpine",
                "essential": False,
                "portMappings": [{"containerPort": 6379, "protocol": "tcp"}],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group":         f"/ecs/{PROJECT}-backend",
                    "awslogs-region":        REGION,
                    "awslogs-stream-prefix": "redis",
                  }
                },
              },
            ],
          }
          print(json.dumps(task))
          PYEOF

          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/backend-task.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text --region "${{ env.AWS_REGION }}")
          echo "arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "✓ Backend task: $TASK_ARN"

      # ── Register frontend task definition ─────────────────
      - name: Register frontend task definition
        id: frontend_task
        env:
          TAG:            ${{ needs.setup.outputs.tag }}
          ALB_DNS:        ${{ needs.setup.outputs.alb_dns }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          python3 - <<'PYEOF' > /tmp/frontend-task.json
          import json, os

          ACCOUNT  = "${{ env.ACCOUNT_ID }}"
          REGION   = "${{ env.AWS_REGION }}"
          PROJECT  = "${{ env.PROJECT }}"
          ECR_BASE = f"{ACCOUNT}.dkr.ecr.{REGION}.amazonaws.com"
          ALB      = os.environ["ALB_DNS"]
          TAG      = os.environ["TAG"]

          task = {
            "family": f"{PROJECT}-frontend",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": f"arn:aws:iam::{ACCOUNT}:role/{PROJECT}-ecs-execution-role",
            "containerDefinitions": [
              {
                "name": "frontend",
                "image": f"{ECR_BASE}/{PROJECT}-frontend:{TAG}",
                "portMappings": [{"containerPort": 3000, "protocol": "tcp"}],
                "essential": True,
                "environment": [
                  {"name": "NEXT_PUBLIC_API_URL", "value": f"http://{ALB}:8000"},
                  {"name": "NEXT_PUBLIC_WS_URL",  "value": f"ws://{ALB}:8000"},
                  {"name": "NEXT_PUBLIC_APP_URL", "value": f"http://{ALB}"},
                  {"name": "NEXTAUTH_URL",         "value": f"http://{ALB}"},
                  {"name": "NEXTAUTH_SECRET",      "value": os.environ.get("NEXTAUTH_SECRET", "")},
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group":         f"/ecs/{PROJECT}-frontend",
                    "awslogs-region":        REGION,
                    "awslogs-stream-prefix": "ecs",
                  }
                },
                # No container healthCheck — ALB target group handles it
                # (ALB is configured to accept 200-399, covering the 307 redirect from Next.js)
              }
            ],
          }
          print(json.dumps(task))
          PYEOF

          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/frontend-task.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text --region "${{ env.AWS_REGION }}")
          echo "arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "✓ Frontend task: $TASK_ARN"

      # ── Update ECS services ───────────────────────────────
      - name: Update backend ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ env.PROJECT }}-cluster" \
            --service  "${{ env.PROJECT }}-backend-svc" \
            --task-definition "${{ steps.backend_task.outputs.arn }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" \
            --output text --query 'service.serviceArn'
          echo "✓ Backend service updated"

      - name: Update frontend ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ env.PROJECT }}-cluster" \
            --service  "${{ env.PROJECT }}-frontend-svc" \
            --task-definition "${{ steps.frontend_task.outputs.arn }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" \
            --output text --query 'service.serviceArn'
          echo "✓ Frontend service updated"

      # ── Wait for stable + print URL ───────────────────────
      - name: Wait for services to stabilize
        run: |
          echo "Waiting for ECS tasks to be healthy (up to 10 min)..."
          aws ecs wait services-stable \
            --cluster "${{ env.PROJECT }}-cluster" \
            --services \
              "${{ env.PROJECT }}-backend-svc" \
              "${{ env.PROJECT }}-frontend-svc" \
            --region "${{ env.AWS_REGION }}"

      - name: Print live URL
        run: |
          ALB="${{ needs.setup.outputs.alb_dns }}"
          echo ""
          echo "✅ Deployment complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🌐  App     : http://${ALB}"
          echo "  🔌  API     : http://${ALB}:8000"
          echo "  📖  Docs    : http://${ALB}:8000/docs"
          echo "  🏷️  Tag     : ${{ needs.setup.outputs.tag }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
